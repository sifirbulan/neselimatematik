name: Neşevren CI

on:
  push:
    branches: [main, nesevren-mobile]
  pull_request:
    branches: [main, nesevren-mobile]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck API
        run: npm --workspace services/api run typecheck

      - name: Typecheck web
        run: npm --workspace apps/web run typecheck

      - name: Test
        run: npm test --workspaces

      - name: Build
        run: npm run build --workspaces

name: One-time coach entry flow

on:
  push:
    branches: [fix/coach-entry-flow]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/coach-entry-flow
      - name: Apply coach entry flow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          auth_path=Path('apps/web/src/auth-ui.js')
          auth=auth_path.read_text()
          auth=auth.replace("const PROFILE_KEY='nesevren-user-profile-v1';", "const PROFILE_KEY='nesevren-user-profile-v1';\nconst POST_LOGIN_KEY='nesevren-post-login-intent-v1';")
          auth=auth.replace("function unavailableMessage(){return'Giriş hizmeti henüz etkinleştirilmedi. Yapılandırma tamamlandığında Google, Apple ve telefonla giriş kullanılabilir.'}", "function unavailableMessage(){return'Giriş hizmeti henüz etkinleştirilmedi. Yapılandırma tamamlandığında Google ve Apple ile giriş kullanılabilir.'}")
          auth=re.sub(r"async function restore\(\)\{.*?\}\nfunction enhanceHeader", '''async function restore(){const hash=new URLSearchParams(location.hash.replace(/^#/,''));const access=hash.get('access_token');if(access){const s={access_token:access,refresh_token:hash.get('refresh_token')||'',expires_at:Date.now()+Number(hash.get('expires_in')||3600)*1000};writeJson(SESSION_KEY,s);history.replaceState(null,'',location.pathname+location.search)}const s=session();if(s?.access_token)currentUser=await fetchUser(s.access_token);enhanceHeader();document.dispatchEvent(new CustomEvent('nesevren-auth-ready',{detail:{loggedIn:Boolean(currentUser)}}));if(currentUser){const intent=localStorage.getItem(POST_LOGIN_KEY);if(intent){removeKey(POST_LOGIN_KEY);setTimeout(()=>document.dispatchEvent(new CustomEvent('nesevren-post-login',{detail:{intent}})),20)}}}\nfunction enhanceHeader''', auth, count=1, flags=re.S)
          auth=re.sub(r"function openLogin\(\)\{.*?\}\nfunction startOAuth", '''function openLogin(){const wrap=modalShell('Neşevren’e giriş yap','Koçluk ve kişisel öğrenme özelliklerini kullanmak için hesabınla giriş yap.',`<div class="authProviders">${providerButton('google','Google ile devam et',GOOGLE_ICON)}${providerButton('apple','Apple ile devam et',APPLE_ICON)}</div><div id="authMsg" aria-live="polite"></div>`);wrap.querySelectorAll('[data-provider]').forEach(btn=>btn.addEventListener('click',()=>startOAuth(btn.dataset.provider,wrap)))}\nfunction startOAuth''', auth, count=1, flags=re.S)
          auth=auth.replace("closeBackdrop();renderEntry();if(!profile())openProfileSetup()", "closeBackdrop();renderEntry();document.dispatchEvent(new CustomEvent('nesevren-auth-ready',{detail:{loggedIn:true}}))")
          bridge="""
window.NesevrenAuth={
  isLoggedIn:()=>Boolean(currentUser),
  getUser:()=>currentUser,
  openLogin:(intent='')=>{if(intent)writeJson(POST_LOGIN_KEY,intent);openLogin()},
};
"""
          auth=auth.replace("document.addEventListener('click',e=>{if(menuEl", bridge+"\ndocument.addEventListener('click',e=>{if(menuEl", 1)
          auth_path.write_text(auth)

          coach=Path('apps/web/src/coach-entry-flow.js')
          coach.write_text(r'''const configuredApiUrl=(import.meta.env.VITE_API_URL??'').trim().replace(/\/+$/,'');
const COACH_API_URL=!configuredApiUrl||configuredApiUrl==='https://nesevren-api.onrender.com'?'https://nesevren-api-v2.onrender.com':configuredApiUrl;
const REQUEST_KEY='nesevren-live-coach-requests-v1';

function auth(){return window.NesevrenAuth||null}
function loggedIn(){return Boolean(auth()?.isLoggedIn?.())}
function user(){return auth()?.getUser?.()||null}
function escapeHtml(value=''){return String(value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function readJson(key,fallback){try{const raw=localStorage.getItem(key);return raw?JSON.parse(raw):fallback}catch{return fallback}}
function writeJson(key,value){try{localStorage.setItem(key,JSON.stringify(value))}catch{}}
function freeKey(){return `nesevren-live-coach-free-used-v1:${user()?.id||'local'}`}
function freeUsed(){try{return localStorage.getItem(freeKey())==='1'}catch{return false}}
function closeCoach(){document.getElementById('coachEntryBackdrop')?.remove();document.body.style.overflow=''}
function setResult(root,html,kind=''){const box=root.querySelector('#coachEntryResult');box.className=`coachEntryResult ${kind}`;box.innerHTML=html}
function requireProblem(root){const input=root.querySelector('#coachProblem');const value=input.value.trim();if(!value){setResult(root,'<strong>Önce seni zorlayan durumu kısaca yaz.</strong>','error');input.focus();return null}return value}

function answerHtml(answer){
  const parts=[];
  const main=answer?.answer||answer?.finalAnswer||'';
  const explanation=answer?.explanation||'';
  if(main)parts.push(`<p>${escapeHtml(main)}</p>`);
  if(explanation)parts.push(`<p>${escapeHtml(explanation)}</p>`);
  if(Array.isArray(answer?.steps)&&answer.steps.length)parts.push(`<ol>${answer.steps.slice(0,6).map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</ol>`);
  if(answer?.hint)parts.push(`<p><strong>İlk adım:</strong> ${escapeHtml(answer.hint)}</p>`);
  return parts.join('')||'<p>Koçluk yanıtı hazırlanamadı.</p>';
}

async function continueWithAi(root){
  const problem=requireProblem(root);if(!problem)return;
  const button=root.querySelector('#coachAiChoice');button.disabled=true;
  setResult(root,'<span class="coachSpinner">✦</span> Sorununu anlamaya çalışıyorum…','loading');
  const prompt=`Sen Neşevren eğitim koçusun. Kullanıcının anlattığı sorun: "${problem}". Önce sorunun özünü bir cümlede anladığını göster. Sonra en fazla 3 uygulanabilir adım öner. Gereksiz uzun anlatma; yargılayıcı olma. Akademik, çalışma düzeni, motivasyon veya hedef sorununa göre yaklaş.`;
  try{
    const response=await fetch(`${COACH_API_URL}/api/v1/questions/analyze`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:prompt,inputType:'text',intent:'solve'})});
    const data=await response.json().catch(()=>null);
    if(!response.ok)throw new Error(data?.error?.message||'Yapay zekâ koçuna şu anda ulaşılamıyor.');
    setResult(root,`<h3>Yapay zekâ koçun</h3>${answerHtml(data)}`,'success');
  }catch(error){setResult(root,escapeHtml(error?.message||'Koçluk yanıtı hazırlanamadı.'),'error')}
  finally{button.disabled=false}
}

function saveLiveRequest(problem){
  const items=readJson(REQUEST_KEY,[]);const list=Array.isArray(items)?items:[];
  list.unshift({id:`${Date.now()}`,userId:user()?.id||null,problem,createdAt:Date.now(),free:true,status:'prepared'});
  writeJson(REQUEST_KEY,list.slice(0,20));
  try{localStorage.setItem(freeKey(),'1')}catch{}
}

function showLiveCoach(root){
  const problem=requireProblem(root);if(!problem)return;
  if(freeUsed()){
    setResult(root,`<h3>Canlı koç</h3><p><strong>Ücretsiz danışma hakkını daha önce kullandın.</strong></p><p>Bundan sonraki canlı koç görüşmeleri ücretlidir. Ücretlendirme ve ödeme ekranını sonraki aşamada bağlayacağız.</p>`,'notice');
    return;
  }
  setResult(root,`<h3>İlk canlı danışmanlığın ücretsiz</h3><p>Bir defaya mahsus canlı koç danışma hakkın var. Bu ücretsiz hak kullanıldıktan sonra sonraki canlı koç görüşmeleri <strong>ücretli</strong> olacaktır.</p><button id="useFreeCoach" class="coachConfirm" type="button">Ücretsiz danışma hakkımı kullan</button>`,'notice');
  root.querySelector('#useFreeCoach')?.addEventListener('click',()=>{
    saveLiveRequest(problem);
    setResult(root,`<h3>Danışma hakkın kaydedildi</h3><p>Ücretsiz canlı danışma talebin hazırlandı. Canlı koç eşleştirme altyapısı bağlandığında bu talep gönderilebilecek.</p><p><strong>Not:</strong> Sonraki canlı koç görüşmelerinin ücretli olacağını unutma.</p>`,'success');
  },{once:true});
}

function openCoach(){
  if(!loggedIn()){auth()?.openLogin?.('coach');return}
  closeCoach();
  const wrap=document.createElement('div');wrap.id='coachEntryBackdrop';wrap.className='coachEntryBackdrop';
  const freeText=freeUsed()?'Ücretsiz hakkını kullandın · sonraki görüşmeler ücretli':'İlk danışma ücretsiz · sonrası ücretli';
  wrap.innerHTML=`<section class="coachEntry" role="dialog" aria-modal="true" aria-labelledby="coachEntryTitle"><button class="coachEntryClose" type="button" aria-label="Kapat">×</button><header><small>NEŞEVREN KOÇLUK</small><h2 id="coachEntryTitle">Seni en çok zorlayan nedir?</h2><p>Sorununu bir iki cümleyle anlat. Sonra nasıl devam etmek istediğini seç.</p></header><label class="coachProblemLabel" for="coachProblem">Şu anda çözmek istediğin sorun</label><textarea id="coachProblem" maxlength="1200" placeholder="Örn. Matematikte konuyu anlıyorum ama soru çözerken nereden başlayacağımı bilemiyorum..."></textarea><div class="coachChoices"><button id="coachAiChoice" class="coachChoice primary" type="button"><span>✦</span><div><strong>Yapay zekâ ile devam edeceğim</strong><small>Sorunumu analiz et ve bana yol göster.</small></div></button><button id="coachLiveChoice" class="coachChoice" type="button"><span>👩‍🏫</span><div><strong>Canlı koç istiyorum</strong><small>${escapeHtml(freeText)}</small></div></button></div><div id="coachEntryResult" class="coachEntryResult" aria-live="polite"></div></section>`;
  document.body.appendChild(wrap);document.body.style.overflow='hidden';
  wrap.querySelector('.coachEntryClose').onclick=closeCoach;wrap.addEventListener('click',e=>{if(e.target===wrap)closeCoach()});
  wrap.querySelector('#coachAiChoice').onclick=()=>continueWithAi(wrap);wrap.querySelector('#coachLiveChoice').onclick=()=>showLiveCoach(wrap);
  setTimeout(()=>wrap.querySelector('#coachProblem')?.focus(),30);
}

document.addEventListener('click',event=>{const target=event.target instanceof Element?event.target:null;const button=target?.closest('[data-nesevren-coach]');if(!button)return;event.preventDefault();event.stopPropagation();if(typeof event.stopImmediatePropagation==='function')event.stopImmediatePropagation();openCoach()},true);
document.addEventListener('nesevren-post-login',event=>{if(event.detail?.intent==='coach')setTimeout(openCoach,80)});
document.addEventListener('keydown',event=>{if(event.key==='Escape')closeCoach()});
''')

          css=Path('apps/web/src/coach-entry-flow.css')
          css.write_text(r'''.coachEntryBackdrop{position:fixed;inset:0;z-index:1700;background:rgba(4,24,25,.55);display:flex;align-items:flex-end;justify-content:center;padding:16px}.coachEntry{position:relative;width:min(620px,100%);max-height:92dvh;overflow:auto;padding:22px;border-radius:26px;background:#fff;color:#15393a;box-shadow:0 20px 55px rgba(0,0,0,.18)}.coachEntryClose{position:absolute;right:14px;top:14px;width:38px;height:38px;border-radius:50%;background:#eef5f4;color:#4f6c6d;font-size:23px}.coachEntry header{padding-right:44px}.coachEntry header small{font-size:10px;font-weight:900;letter-spacing:.12em;color:#0b7778}.coachEntry h2{margin:7px 0 6px;color:#063f40;font-size:27px;line-height:1.15}.coachEntry header p{margin:0 0 18px;color:#667b7c;font-size:13px;line-height:1.5}.coachProblemLabel{display:block;margin-bottom:7px;font-size:11px;font-weight:850;color:#315c5d}.coachEntry textarea{width:100%;min-height:110px;padding:14px;border:1px solid #d8e7e5;border-radius:17px;resize:vertical;outline:none;background:#fbfdfd;color:#15393a;font:inherit;line-height:1.5}.coachEntry textarea:focus{border-color:#0b7778;box-shadow:0 0 0 3px rgba(11,119,120,.08)}.coachChoices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:13px}.coachChoice{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;padding:15px;border:1px solid #d8e7e5;border-radius:18px;background:#fff;color:#15393a;text-align:left}.coachChoice>span{font-size:25px}.coachChoice strong{display:block;color:#063f40;font-size:13px}.coachChoice small{display:block;margin-top:3px;color:#6b8081;font-size:10px;line-height:1.35}.coachChoice.primary{background:linear-gradient(135deg,#064849,#0b7274);border-color:transparent}.coachChoice.primary strong{color:#fff}.coachChoice.primary small{color:rgba(255,255,255,.76)}.coachChoice.primary>span{color:#fff}.coachChoice:disabled{opacity:.55}.coachEntryResult{margin-top:12px}.coachEntryResult:empty{display:none}.coachEntryResult:not(:empty){padding:14px;border-radius:16px;background:#f3f8f7;color:#466768;font-size:12px;line-height:1.55}.coachEntryResult h3{margin:0 0 7px;color:#063f40;font-size:15px}.coachEntryResult p{margin:6px 0}.coachEntryResult ol{padding-left:20px}.coachEntryResult.error{background:#fff0f0;color:#9c4343}.coachEntryResult.success{background:#edf8f5}.coachEntryResult.notice{background:#fff8e7;color:#715a25}.coachConfirm{margin-top:9px;padding:11px 13px;border-radius:12px;background:#0b696b;color:#fff;font-weight:850}.coachSpinner{display:inline-block;margin-right:7px;animation:coachSpin 1s linear infinite}@keyframes coachSpin{to{transform:rotate(360deg)}}@media(max-width:600px){.coachEntryBackdrop{padding:0}.coachEntry{width:100%;max-height:96dvh;padding:20px 16px 24px;border-radius:26px 26px 0 0}.coachEntry h2{font-size:24px}.coachChoices{grid-template-columns:1fr}.coachChoice{min-height:76px}.coachEntry textarea{min-height:105px}}''')

          index=Path('apps/web/index.html')
          text=index.read_text()
          text=text.replace('<link rel="stylesheet" href="/src/coach-hub.css" />','<link rel="stylesheet" href="/src/coach-entry-flow.css" />')
          text=text.replace('    <script type="module" src="/src/auth-login-cleanup.js"></script>\n','')
          text=text.replace('<script type="module" src="/src/coach-hub.js"></script>','<script type="module" src="/src/coach-entry-flow.js"></script>')
          index.write_text(text)
          PY
      - name: Remove one-time workflow
        run: rm .github/workflows/one-time-coach-entry-flow.yml
      - name: Commit changes
        run: |
          git config user.name "sifirbulan"
          git config user.email "sifirbulan@gmail.com"
          git add -A
          git commit -m "feat: add authenticated coach choice flow"
          git push origin HEAD:fix/coach-entry-flow
